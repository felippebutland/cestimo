apiVersion: 1

# Alertas do Cestimo. Aparecem em Grafana > Alerting. Para receber por e-mail, Telegram, Slack etc.,
# crie um "Contact point" lá e aponte a política padrão para ele (passo a passo no README).
groups:
  - orgId: 1
    name: cestimo-mercados
    folder: Cestimo
    interval: 1m
    rules:
      # Mercado errando: 80% ou mais das buscas dos últimos 30 min deram erro ou ficaram indisponíveis (mínimo de 3 buscas).
      - uid: cestimo-mercado-quebrado
        title: Mercado com erro
        condition: C
        for: 10m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.source }}: {{ humanizePercentage $values.B.Value }} das buscas falharam nos últimos 30 min"
          description: "Veja o painel de logs do Cestimo. Pode ser bloqueio do site do mercado, mudança no site ou queda."
        data:
          - refId: A
            relativeTimeRange: { from: 1800, to: 0 }
            datasourceUid: prom
            model:
              refId: A
              instant: true
              expr: >-
                (sum by (source) (increase(source_searches_total{result=~"erro|indisponivel"}[30m]))
                / sum by (source) (increase(source_searches_total[30m])))
                and on (source) (sum by (source) (increase(source_searches_total[30m])) >= 3)
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0.8] }

      # Mercado "funcionando" mas sem achar nada: 95% ou mais das buscas das últimas 6 h vieram vazias (mínimo de 8 buscas).
      # Costuma ser o site do mercado ter mudado e o leitor de preços ter parado de enxergar os produtos.
      - uid: cestimo-mercado-sem-resultado
        title: Mercado sem achar produtos
        condition: C
        for: 30m
        noDataState: OK
        execErrState: OK
        labels:
          severity: info
        annotations:
          summary: "{{ $labels.source }}: {{ humanizePercentage $values.B.Value }} das buscas das últimas 6 h vieram sem resultado"
          description: "Teste o mercado com `npx tsx scripts/check-markets.ts`. O layout do site pode ter mudado."
        data:
          - refId: A
            relativeTimeRange: { from: 21600, to: 0 }
            datasourceUid: prom
            model:
              refId: A
              instant: true
              expr: >-
                (sum by (source) (increase(source_searches_total{result="empty"}[6h]))
                / sum by (source) (increase(source_searches_total[6h])))
                and on (source) (sum by (source) (increase(source_searches_total[6h])) >= 8)
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0.95] }

      # O próprio Cestimo parou de responder ao Prometheus.
      - uid: cestimo-fora-do-ar
        title: Cestimo fora do ar
        condition: C
        for: 3m
        noDataState: Alerting
        execErrState: Alerting
        labels:
          severity: critical
        annotations:
          summary: "O Prometheus não consegue ler as métricas do Cestimo há 3 min"
          description: "Container parado, reiniciando em loop ou sem memória. Veja `docker compose logs cestimo`."
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prom
            model:
              refId: A
              instant: true
              expr: 'min(up{job="cestimo"})'
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: lt, params: [1] }

      # Teste automático: o app busca "leite integral 1L" em cada mercado de hora em hora, mesmo sem ninguém usando.
      # Alerta quando 90% ou mais dos testes das últimas 3 h falharam (mínimo de 2 testes): o mercado mudou o site ou bloqueou.
      - uid: cestimo-mercado-teste-automatico
        title: Mercado falhou no teste automático
        condition: C
        for: 5m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.source }}: {{ humanizePercentage $values.B.Value }} dos testes automáticos das últimas 3 h falharam"
          description: "Rode `npm run markets:check` para ver o que a loja devolve. O site pode ter mudado ou bloqueado o leitor."
        data:
          - refId: A
            relativeTimeRange: { from: 10800, to: 0 }
            datasourceUid: prom
            model:
              refId: A
              instant: true
              expr: >-
                (sum by (source) (increase(source_probe_total{result="falha"}[3h]))
                / sum by (source) (increase(source_probe_total[3h])))
                and on (source) (sum by (source) (increase(source_probe_total[3h])) >= 2)
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0.9] }

  - orgId: 1
    name: cestimo-contas
    folder: Cestimo
    interval: 5m
    rules:
      # Login com Google falhando: 5 ou mais erros de login na última hora. Pode ser credencial/URI de redirecionamento errados ou o Google fora.
      - uid: cestimo-login-erros
        title: Erros de login com Google
        condition: C
        for: 10m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
        annotations:
          summary: "{{ humanize $values.B.Value }} erros de login na última hora"
          description: "Confira GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, PUBLIC_URL e o URI de redirecionamento no Google Cloud. Veja os eventos login_error no painel de contas."
        data:
          - refId: A
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: prom
            model:
              refId: A
              instant: true
              expr: >-
                sum(increase(auth_events_total{event="login_error"}[1h]))
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [4] }

      # Rotina diária dos acompanhados falhando: mais da metade dos produtos deram falha nas últimas 24 h (mínimo de 2 buscas).
      - uid: cestimo-acompanhados-falha
        title: Rotina dos preços acompanhados falhando
        condition: C
        for: 30m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
        annotations:
          summary: "{{ humanizePercentage $values.B.Value }} das buscas dos produtos acompanhados falharam nas últimas 24 h"
          description: "A rotina das 7h consulta os mercados para o painel das contas. Veja se algum mercado está fora do ar (alertas de mercado) e os logs tracked_refresh."
        data:
          - refId: A
            relativeTimeRange: { from: 86400, to: 0 }
            datasourceUid: prom
            model:
              refId: A
              instant: true
              expr: >-
                (sum(increase(tracked_refresh_total{result="failed"}[24h])) / (sum(increase(tracked_refresh_total{result="failed"}[24h])) + sum(increase(tracked_refresh_total{result="refreshed"}[24h])))) and (sum(increase(tracked_refresh_total{result="failed"}[24h])) + sum(increase(tracked_refresh_total{result="refreshed"}[24h])) >= 2)
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0.5] }

      # Envio de notificação falhando: 3 ou mais falhas de envio (não conta aparelhos que sumiram) nas últimas 6 h.
      - uid: cestimo-push-conta-falha
        title: Aviso de queda (conta) falhando
        condition: C
        for: 15m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
        annotations:
          summary: "{{ humanize $values.B.Value }} envios de aviso falharam nas últimas 6 h"
          description: "Confira se vapid.json existe no volume e se o servidor alcança os serviços de push (FCM, Mozilla, Apple). Veja os logs tracked_notify."
        data:
          - refId: A
            relativeTimeRange: { from: 21600, to: 0 }
            datasourceUid: prom
            model:
              refId: A
              instant: true
              expr: >-
                sum(increase(push_events_total{event="account_failed"}[6h]))
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [2] }
