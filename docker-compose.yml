services:
  cestimo:
    build: .
    image: cestimo
    ports:
      # Só acessível a partir da sua máquina. Troque por "3000:3000" para abrir na rede local.
      - "127.0.0.1:3000:3000"
    volumes:
      # Para trocar de cidade/mercados basta editar config/markets.json e reiniciar (sem rebuild).
      - ./config:/app/config:ro
    environment:
      MARKETS_FILE: /app/config/markets.json
    init: true            # encerra processos filhos do Chromium corretamente
    shm_size: "1gb"       # o Chromium usa /dev/shm; o padrão do Docker (64 MB) é pouco
    restart: unless-stopped
