# Produção: app + Caddy (HTTPS automático). Uso:
#   cp .env.example .env   # preencha DOMAIN e METRICS_TOKEN
#   docker compose -f docker-compose.prod.yml up -d --build
services:
  cestimo:
    build: .
    image: cestimo
    restart: unless-stopped
    environment:
      MARKETS_FILE: /app/config/markets.json
      TRUST_PROXY: "1"                     # o IP real vem do Caddy
      METRICS_TOKEN: ${METRICS_TOKEN:?defina METRICS_TOKEN no arquivo .env}
      APP_NAME: ${APP_NAME:-Cestimo}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-20}
      RATE_LIMIT_WINDOW_MIN: ${RATE_LIMIT_WINDOW_MIN:-60}
      MAX_CONCURRENT: ${MAX_CONCURRENT:-2}
      BROWSER_PAGES: ${BROWSER_PAGES:-6}        # páginas do Chromium ao mesmo tempo: mais = busca mais rápida e mais memória (medido: 3→40s; 6, 9 e 12 ficam em ~21-30s; pico de memória real ~1,1 GB com 6, ~1,3 GB com 9 e ~1,5 GB com 12, o limite do container)
      SOURCE_CONCURRENCY: ${SOURCE_CONCURRENCY:-3}  # buscas simultâneas em cada loja
      TZ_OFFSET_MIN: ${TZ_OFFSET_MIN:--180}   # fuso dos gráficos por dia (-180 = Brasília)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}          # login com Google (opcional): sem os três, o app funciona sem conta
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      PUBLIC_URL: ${PUBLIC_URL:-}                      # ex.: https://cestimo.butland.sbs
    volumes:
      - ./config:/app/config:ro
      - cestimo_data:/app/data            # números do painel (/admin)
    expose:
      - "3000"                             # rede interna do Compose (o Caddy usa esta)
    ports:
      - "127.0.0.1:3000:3000"              # só no próprio computador: origem para Cloudflare Tunnel (cloudflared) ou testes
    init: true
    shm_size: "1gb"
    mem_limit: 1536m
    labels:
      logging: cestimo                    # só containers com este rótulo têm os logs lidos pelo Alloy (perfil monitoring)
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }   # logs com rotação (sem IP; ver privacidade)

  caddy:
    image: caddy:2
    restart: unless-stopped
    labels:
      logging: cestimo
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?defina DOMAIN no arquivo .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      cestimo:
        condition: service_healthy

  # ---- Opcional: gráficos históricos. Ative com:  docker compose -f docker-compose.prod.yml --profile monitoring up -d
  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["monitoring"]
    restart: unless-stopped
    environment:
      METRICS_TOKEN: ${METRICS_TOKEN:-}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - printf %s "$$METRICS_TOKEN" > /tmp/metrics_token && exec /bin/prometheus --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.path=/prometheus --storage.tsdb.retention.time=90d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    mem_limit: 384m
    depends_on:
      cestimo:
        condition: service_healthy

  grafana:
    image: grafana/grafana-oss:11.3.0
    profiles: ["monitoring"]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-https://${DOMAIN:-localhost}/grafana/}   # endereço público do Grafana (com a barra final)
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "127.0.0.1:3001:3000"   # só no próprio computador: origem para o Cloudflare Tunnel (grafana.seudominio)
    entrypoint: ["/bin/sh", "-c"]
    command:
      - '[ -n "$$GF_SECURITY_ADMIN_PASSWORD" ] || { echo "Defina GRAFANA_PASSWORD no .env"; exit 1; }; exec /run.sh'
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    mem_limit: 384m
    depends_on:
      - prometheus
      - loki

  # ---- Logs no Grafana (perfil monitoring): Loki guarda por 14 dias; Alloy lê os logs dos containers do Cestimo.
  loki:
    image: grafana/loki:3.7.10
    profiles: ["monitoring"]
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./monitoring/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    mem_limit: 256m

  alloy:
    image: grafana/alloy:v1.22.0
    profiles: ["monitoring"]
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./monitoring/alloy.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro   # só para descobrir containers e ler seus logs
      - alloy_data:/var/lib/alloy/data
    mem_limit: 192m
    depends_on:
      - loki

volumes:
  cestimo_data:
  caddy_data:
  caddy_config:
  prometheus_data:
  grafana_data:
  loki_data:
  alloy_data:
